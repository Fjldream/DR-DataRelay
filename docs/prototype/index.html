    const stage=document.getElementById('stage');

    function bindRuntime(){stage.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{currentPage=el.dataset.page;mount()}));stage.querySelectorAll('[data-device]').forEach(el=>el.addEventListener('click',()=>{activeDevice=el.dataset.device;mount()}));stage.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>handleAction(el)));stage.querySelectorAll('.switch').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('on')))}
    function handleAction(el){const action=el.dataset.action;if(action==='manage-device')openManage();if(action==='test-kh'){el.disabled=true;el.textContent='正在测试…';setTimeout(()=>{el.disabled=false;el.textContent='测试连接';showToast('连接成功，Client Name 已注册')},850)}if(action==='save-config')showToast('转发配置已保存')}
    function openManage(){const modal=document.getElementById('modal');document.getElementById('modal-content').innerHTML=`<div class="dialog-head"><h2>设备点位映射<small>将实际报文字段绑定到现有 KH 变量</small></h2><button class="dialog-close" data-close>×</button></div><div class="dialog-body"><div class="form-grid"><div class="field"><label>设备名称</label><input value="北区流量计 18" /></div><div class="field"><label>预计上报周期</label><input value="15 分钟" /></div></div><div class="identity-strip"><div class="identity-item"><small>STC · 暂作主匹配</small><b>211000000932</b></div><div class="identity-item"><small>SN · 报文原值</small><b>0000000000</b></div><div class="identity-item"><small>IMEI · 辅助校验</small><b>8690980••••2173</b></div></div><div class="mapping-head"><div><h3>报文中检测到 7 个可配置字段</h3><p>目标点位使用 KH 中的完整变量名，不按规则自动拼接。</p></div><div class="mapping-actions"><button class="button small" data-modal-action="sync-tags">刷新 KH 点位</button><button class="button small" data-modal-action="create-tag">创建新点位</button></div></div><div class="channel-map"><div class="channel-row header"><span>字段</span><span>最新值</span><span>业务含义</span><span>目标 KH 点位</span><span>KH 类型</span><span>写入</span></div>${channelRow('V','3.60','GPRS电压','北区_GPRS电压','FLOAT64',true)}${channelRow('A01','3.066','瞬时流量','流量计01_瞬时流量','FLOAT64',true)}${channelRow('A02','3.652','水表电压','水表01_电压','FLOAT64',true)}${channelRow('A03','0.036','进水压力','','—',false)}${channelRow('P01','3663','正累计流量','FT101_POS_TOTAL','INT64',true)}${channelRow('P02','54','负累计流量','','—',false)}${channelRow('K01','00','未纳入指标表','','—',false)}</div><datalist id="kh-tags"><option value="北区_GPRS电压"><option value="流量计01_瞬时流量"><option value="水表01_电压"><option value="FT101_POS_TOTAL"><option value="PRESSURE_IN_12"><option value="FLOW_NEG_TOTAL_12"></datalist><p class="mapping-note">本帧未出现 A04 和 P03，因此暂不显示；K01 未出现在客户指标表中，默认不写入 KH。</p></div><div class="dialog-actions"><button class="button" data-close>取消</button><button class="button primary" id="confirm-manage">保存点位映射</button></div>`;const tagTypes={'北区_GPRS电压':'FLOAT64','流量计01_瞬时流量':'FLOAT64','水表01_电压':'FLOAT64','FT101_POS_TOTAL':'INT64','PRESSURE_IN_12':'FLOAT64','FLOW_NEG_TOTAL_12':'INT64'};modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.close());modal.querySelectorAll('.kh-tag').forEach(input=>input.oninput=()=>{const type=tagTypes[input.value.trim()]||(input.value.trim()?'未识别':'—');const chip=input.closest('.channel-row').querySelector('.kh-type');chip.textContent=type;chip.className=`chip kh-type ${type==='—'||type==='未识别'?'':'blue'}`});modal.querySelector('[data-modal-action="sync-tags"]').onclick=()=>showToast('已从 KH 同步 1,011 个变量');modal.querySelector('[data-modal-action="create-tag"]').onclick=()=>showToast('可通过 KH 建点接口创建新变量');modal.querySelector('#confirm-manage').onclick=()=>{const checked=[...modal.querySelectorAll('.channel-row input[type="checkbox"]:checked')];const invalid=checked.find(cb=>!cb.closest('.channel-row').querySelector('.kh-tag').value.trim());if(invalid){invalid.closest('.channel-row').querySelector('.kh-tag').focus();showToast('写入 KH 的字段必须选择目标点位');return}const unknown=checked.find(cb=>['—','未识别'].includes(cb.closest('.channel-row').querySelector('.kh-type').textContent));if(unknown){unknown.closest('.channel-row').querySelector('.kh-tag').focus();showToast('请从已同步的 KH 点位中选择');return}const tags=checked.map(cb=>cb.closest('.channel-row').querySelector('.kh-tag').value.trim());if(new Set(tags).size!==tags.length){showToast('同一个 KH 点位不能重复绑定');return}managed=true;pendingCount=Math.max(0,pendingCount-1);modal.close();mount();showToast(`点位映射已保存，共启用 ${checked.length} 个字段`)};modal.showModal()}
    function channelRow(field,value,name,tag,type,enabled){return`<label class="channel-row"><code>${field}</code><span>${value}</span><span>${name}</span><input class="kh-tag" type="text" list="kh-tags" value="${tag}" placeholder="搜索 KH 完整变量名" aria-label="${field} 目标 KH 点位" /><span><span class="chip kh-type ${type==='—'?'':'blue'}">${type}</span></span><input type="checkbox" ${enabled?'checked':''} aria-label="写入 KH ${field}" /></label>`}
    function showToast(message){const toast=document.getElementById('toast');document.getElementById('toast-text').textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
    mount();
  </script>
</body>
</html>
